name: Portfolio Daily Build

# NOTE ON THE SCHEDULE
# 11:00 UTC is 07:00 ET only while the US is on EDT. From November to March it
# fires at 06:00 ET. GitHub cron has no timezone support, so pick the hour you
# want in winter and accept the summer drift, or edit twice a year.
#
# NOTE ON ACTION PINS
# Verified to resolve on 2026-08-15. Note that setup-uv stopped publishing
# floating major tags after v7, so it must be pinned to an exact patch version —
# `@v10` is not a ref and fails the job before any step runs.

on:
  schedule:
    # Mon / Wed / Fri. Halved from six days to cut token spend — the binding
    # constraint here is model usage, not ambition. Raise it once a week of
    # real runs has shown what each one actually costs.
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      task_id:
        description: "Force a specific backlog task id (e.g. CLE-03). Blank = normal rotation."
        required: false
        type: string
      dry_run:
        description: "Select and print the task, then stop without invoking Claude."
        required: false
        type: boolean
        default: false

concurrency:
  group: portfolio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false   # the orchestrator has no Python deps; targets manage their own

      - name: Select today's work unit
        id: pick
        run: |
          set +e
          python scripts/pick_task.py > .task.json 2> .task.log
          code=$?
          set -e
          cat .task.log

          case "$code" in
            0) : ;;
            2) echo "reason=paused-or-unconfigured" >> "$GITHUB_OUTPUT"
               echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            3) echo "reason=backlog-exhausted"      >> "$GITHUB_OUTPUT"
               echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "::error::pick_task.py failed to parse the backlog"; exit 1 ;;
          esac

          tier_model=$(python -c "import json;print(json.load(open('.task.json'))['model'])")
          case "$tier_model" in
            opus)   model="claude-opus-5" ;;
            sonnet) model="claude-sonnet-5" ;;
            haiku)  model="claude-haiku-4-5" ;;
            *)      model="$tier_model" ;;
          esac

          {
            echo "proceed=true"
            echo "model=$model"
            echo "task_id=$(python -c "import json;print(json.load(open('.task.json'))['id'])")"
            echo "repo=$(python -c "import json;print(json.load(open('.task.json'))['repo_full'])")"
          } >> "$GITHUB_OUTPUT"

      - name: Report a skipped day
        if: steps.pick.outputs.proceed != 'true'
        run: |
          echo "### Skipped: ${{ steps.pick.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "A skipped day is an acceptable outcome. See CLAUDE.md." >> "$GITHUB_STEP_SUMMARY"

      # Without this, a missing secret surfaces as an authentication error from
      # inside the action, several hundred log lines down. Say it plainly instead.
      - name: Preflight — required secrets
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PAT: ${{ secrets.GH_PORTFOLIO_TOKEN }}
        run: |
          missing=0
          if [[ -z "$OAUTH" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token', then"
            echo "::error::gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo vitejbari/portfolio-engine"
            missing=1
          fi
          if [[ -z "$PAT" ]]; then
            echo "::error::GH_PORTFOLIO_TOKEN is not set. Create a fine-grained PAT scoped to the"
            echo "::error::four portfolio repos (Contents/PRs/Issues RW), then"
            echo "::error::gh secret set GH_PORTFOLIO_TOKEN --repo vitejbari/portfolio-engine"
            missing=1
          fi
          (( missing )) && exit 1
          echo "both secrets present"

          # Presence is not validity. An expired PAT would otherwise sail past the
          # check above and fail deep inside the build with an opaque git auth
          # error — the silent-morning-failure mode this whole preflight exists to
          # prevent. Validate it live, and surface the expiry countdown.
          # A stray newline or space survives the paste into `gh secret set` and
          # makes the Authorization header malformed — indistinguishable from a
          # bad token at the API. Strip whitespace before using it.
          PAT="$(printf '%s' "$PAT" | tr -d '[:space:]')"

          # Two stages, because "the token is wrong" and "the token can't see this
          # repo" have completely different fixes and the same symptom otherwise.
          hdrs=$(mktemp); body=$(mktemp)
          who=$(curl -sS -o "$body" -D "$hdrs" -w '%{http_code}' \
                  -H "Authorization: Bearer $PAT" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/user)
          if [[ "$who" == "401" ]]; then
            echo "::error::GH_PORTFOLIO_TOKEN is not a valid GitHub credential (HTTP 401 on /user)."
            echo "::error::The token value itself is wrong — not a permissions problem."
            echo "::error::Usual causes: the paste was truncated or picked up the wrong clipboard"
            echo "::error::entry, the token was revoked, or a non-GitHub token was pasted by mistake."
            echo "::error::Verify a candidate token locally before re-uploading:"
            echo "::error::  read -rs T && curl -so /dev/null -w '%{http_code}\\n' -H \"Authorization: Bearer \$T\" https://api.github.com/user"
            echo "::error::200 means good. Then: gh secret set GH_PORTFOLIO_TOKEN --repo vitejbari/portfolio-engine"
            exit 1
          elif [[ "$who" != "200" ]]; then
            echo "::error::GH_PORTFOLIO_TOKEN failed an identity check (HTTP $who on /user)."
            exit 1
          fi
          echo "token authenticates as: $(python3 -c 'import json;print(json.load(open("'"$body"'"))["login"])')"

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer $PAT" \
                   -H "Accept: application/vnd.github+json" \
                   https://api.github.com/repos/vitejbari/clinical-llm-eval)
          if [[ "$code" != "200" ]]; then
            echo "::error::Token is valid but cannot reach vitejbari/clinical-llm-eval (HTTP $code)."
            echo "::error::The PAT's repository selection is missing one or more portfolio repos."
            echo "::error::Edit it to cover all four (portfolio-engine, clinical-llm-eval, ml-lab,"
            echo "::error::vitejbari) with Contents / Pull requests / Issues read-write."
            exit 1
          fi

          # Fine-grained PATs report their own expiry in a response header.
          exp=$(grep -i '^github-authentication-token-expiration:' "$hdrs" \
                  | cut -d: -f2- | tr -d '\r' | xargs || true)
          if [[ -n "$exp" ]]; then
            left=$(( ( $(date -u -d "$exp" +%s) - $(date -u +%s) ) / 86400 ))
            echo "PAT valid; expires ${exp} (${left} days)"
            if (( left <= 21 )); then
              echo "::warning::GH_PORTFOLIO_TOKEN expires in ${left} day(s), on ${exp}."
              echo "::warning::Renew it before then or the daily build stops: mint a new PAT and re-run"
              echo "::warning::gh secret set GH_PORTFOLIO_TOKEN --repo vitejbari/portfolio-engine"
              {
                echo "## ⚠️ PAT expires in ${left} days (${exp})"
                echo "Renew at <https://github.com/settings/personal-access-tokens/new>, then:"
                echo '```'
                echo "gh secret set GH_PORTFOLIO_TOKEN --repo vitejbari/portfolio-engine"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "PAT valid; no expiry header returned (classic token or no expiration set)"
          fi

      # The action takes `prompt`, not `prompt_file` — an unknown input is only a
      # warning, so the misspelling ran the agent with an empty prompt and exited
      # green having done nothing. Read the file in and pass its contents.
      - name: Load the build prompt
        id: prompt
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        run: |
          {
            echo 'text<<CLAUDE_PROMPT_EOF'
            cat .github/prompts/daily-build.md
            echo
            echo "## Today's work unit"
            echo
            echo 'This run has already selected its task. The JSON below is also on disk'
            echo 'at `.task.json` in the orchestrator checkout.'
            echo
            echo '```json'
            cat .task.json
            echo '```'
            echo 'CLAUDE_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build the work unit
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        id: build
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          # The action reports `is_error: true` without saying why. These surface
          # the underlying failure instead of leaving a one-line dead end.
          show_full_output: true
          display_report: true
          claude_args: |
            --model ${{ steps.pick.outputs.model }}
            --max-turns 30
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,mcp__github__create_pull_request,mcp__github__create_issue"
        env:
          # The PAT is what lets this run push to the sibling portfolio repos and
          # what makes the commits attributable to a real account rather than a bot.
          GH_PORTFOLIO_TOKEN: ${{ secrets.GH_PORTFOLIO_TOKEN }}
          FORCED_TASK_ID: ${{ inputs.task_id }}

      # The action writes a structured trace and then discards it. On failure it
      # is the only thing that says what actually went wrong.
      - name: Dump the agent's execution trace
        if: failure() && steps.build.outcome == 'failure'
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [[ -f "$f" ]]; then
            echo "=== claude-execution-output.json ==="
            python3 -m json.tool "$f" 2>/dev/null || cat "$f"
          else
            echo "no execution trace at $f"
            ls -la /home/runner/work/_temp/ | head -30
          fi

      - name: Persist run state and log
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        run: |
          rm -f .task.json .task.log
          if [[ -z "$(git status --porcelain)" ]]; then
            # A run that records nothing is not a success, whatever the agent's
            # exit code said. Even a deliberately skipped day writes a log entry
            # and a --record-skip. Silence here means the agent never ran, or ran
            # without a prompt, and a green tick would hide that.
            echo "::error::Run produced no change to STATE.json, BACKLOG.md, or logs/."
            echo "::error::The agent did not record an outcome — it likely never received"
            echo "::error::a prompt, or exited before Step 7. Check the Build step's output."
            exit 1
          fi
          git config user.name  "$(python -c "import json;print(json.load(open('STATE.json'))['git_identity']['name'])")"
          git config user.email "$(python -c "import json;print(json.load(open('STATE.json'))['git_identity']['email'])")"
          git add STATE.json BACKLOG.md logs/
          git commit -m "chore(engine): record run for ${{ steps.pick.outputs.task_id }}

          Bookkeeping only: cycle counter, run log, and any backlog edits the
          agent made after learning something during the build."
          git push
