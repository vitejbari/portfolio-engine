name: Portfolio Daily Build

# NOTE ON THE SCHEDULE
# 11:00 UTC is 07:00 ET only while the US is on EDT. From November to March it
# fires at 06:00 ET. GitHub cron has no timezone support, so pick the hour you
# want in winter and accept the summer drift, or edit twice a year.
#
# NOTE ON ACTION PINS
# Verified to resolve on 2026-08-15. Note that setup-uv stopped publishing
# floating major tags after v7, so it must be pinned to an exact patch version —
# `@v10` is not a ref and fails the job before any step runs.

on:
  schedule:
    # Mon / Wed / Fri. Halved from six days to cut token spend — the binding
    # constraint here is model usage, not ambition. Raise it once a week of
    # real runs has shown what each one actually costs.
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch:
    inputs:
      task_id:
        description: "Force a specific backlog task id (e.g. CLE-03). Blank = normal rotation."
        required: false
        type: string
      dry_run:
        description: "Select and print the task, then stop without invoking Claude."
        required: false
        type: boolean
        default: false

concurrency:
  group: portfolio-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false   # the orchestrator has no Python deps; targets manage their own

      - name: Select today's work unit
        id: pick
        run: |
          set +e
          python scripts/pick_task.py > .task.json 2> .task.log
          code=$?
          set -e
          cat .task.log

          case "$code" in
            0) : ;;
            2) echo "reason=paused-or-unconfigured" >> "$GITHUB_OUTPUT"
               echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            3) echo "reason=backlog-exhausted"      >> "$GITHUB_OUTPUT"
               echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "::error::pick_task.py failed to parse the backlog"; exit 1 ;;
          esac

          tier_model=$(python -c "import json;print(json.load(open('.task.json'))['model'])")
          case "$tier_model" in
            opus)   model="claude-opus-5" ;;
            sonnet) model="claude-sonnet-5" ;;
            haiku)  model="claude-haiku-4-5" ;;
            *)      model="$tier_model" ;;
          esac

          {
            echo "proceed=true"
            echo "model=$model"
            echo "task_id=$(python -c "import json;print(json.load(open('.task.json'))['id'])")"
            echo "repo=$(python -c "import json;print(json.load(open('.task.json'))['repo_full'])")"
          } >> "$GITHUB_OUTPUT"

      - name: Report a skipped day
        if: steps.pick.outputs.proceed != 'true'
        run: |
          echo "### Skipped: ${{ steps.pick.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "A skipped day is an acceptable outcome. See CLAUDE.md." >> "$GITHUB_STEP_SUMMARY"

      # Without this, a missing secret surfaces as an authentication error from
      # inside the action, several hundred log lines down. Say it plainly instead.
      - name: Preflight — required secrets
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PAT: ${{ secrets.GH_PORTFOLIO_TOKEN }}
        run: |
          missing=0
          if [[ -z "$OAUTH" ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token', then"
            echo "::error::gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo vitejbari/portfolio-engine"
            missing=1
          fi
          if [[ -z "$PAT" ]]; then
            echo "::error::GH_PORTFOLIO_TOKEN is not set. Create a fine-grained PAT scoped to the"
            echo "::error::four portfolio repos (Contents/PRs/Issues RW), then"
            echo "::error::gh secret set GH_PORTFOLIO_TOKEN --repo vitejbari/portfolio-engine"
            missing=1
          fi
          (( missing )) && exit 1
          echo "both secrets present"

      - name: Build the work unit
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: .github/prompts/daily-build.md
          claude_args: |
            --model ${{ steps.pick.outputs.model }}
            --max-turns 30
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,mcp__github__create_pull_request,mcp__github__create_issue"
        env:
          # The PAT is what lets this run push to the sibling portfolio repos and
          # what makes the commits attributable to a real account rather than a bot.
          GH_PORTFOLIO_TOKEN: ${{ secrets.GH_PORTFOLIO_TOKEN }}
          FORCED_TASK_ID: ${{ inputs.task_id }}

      - name: Persist run state and log
        if: steps.pick.outputs.proceed == 'true' && inputs.dry_run != true
        run: |
          rm -f .task.json .task.log
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "::warning::run produced no change to STATE.json or logs/ — the agent did not record its outcome"
            exit 0
          fi
          git config user.name  "$(python -c "import json;print(json.load(open('STATE.json'))['git_identity']['name'])")"
          git config user.email "$(python -c "import json;print(json.load(open('STATE.json'))['git_identity']['email'])")"
          git add STATE.json BACKLOG.md logs/
          git commit -m "chore(engine): record run for ${{ steps.pick.outputs.task_id }}

          Bookkeeping only: cycle counter, run log, and any backlog edits the
          agent made after learning something during the build."
          git push
